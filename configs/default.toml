# Doppelgänger configuration — every tunable lives here.
seed = 42

[paths]
data_dir = "student_resource/dataset"   # read-only original data
work_dir = "artifacts"                  # cached parquet / models / reports (safe to delete; rebuilt by the pipeline)
output_dir = "output"

[prep]
max_numbers = 6          # address digit-runs kept per record (int32 matrix)

[lexicon]
pair_sample = 1500000    # labelled pairs sampled to learn equivalences
component_min_count = 40 # a variant component must be seen this often
component_min_share = 0.5  # P(canonical | variant) needed to accept a mapping
foreign_max_ratio = 0.2  # variant must be rare in Source 1 (freq_S1 / freq_other)
translit_min_count = 3
translit_min_share = 0.5
locality_min_share = 0.0005  # component frequency (per country) to count as a locality
pseudo_min_len = 5       # min length of an out-of-vocabulary single-token name
pseudo_pair_max = 400000 # France/unlabelled countries: pseudo-pairs used for equivalences

[blocking]
s1_key_cap = 150         # skip keys shared by more Source-1 records than this (30 -> 150: pair recall 0.9605 -> 0.9710)
top_per_record = 8       # max candidates kept per Source-2/3 record (ranked by weighted key votes)
min_rel_votes = 0.35     # and only those with votes >= this fraction of the record's best
chunk_size = 250000      # Source-2/3 records per blocking chunk (bounds the posting-list expansion)
number_keys = 3          # first N address numbers used in number keys
name1_key = true         # single core-name token (typo in the other token + empty address)
addr_pair_key = true     # pair of street/locality tokens (pseudo-names with a rewritten house number)
num_del_key = true       # Source-1 number with one digit deleted (the commonest number noise)

[split]
valid_frac = 0.10        # Source-1 entities for model / feature / decision selection
test_frac = 0.10         # Source-1 entities scored once, at the end (never used for any choice)
train_frac = 0.50        # development-model training entities (the final model refits on every labelled entity)

[model]
num_leaves = 127
learning_rate = 0.06
n_estimators = 600
min_child_samples = 100
subsample = 0.7
colsample_bytree = 0.8
exclude = []             # feature-store columns hidden from the models (ablation-driven)
coherence = true         # group-coherence features (record vs the entity's most confident other record)
folds = 2                # out-of-fold stage-1 scores for the stage-2 (competition) model

[decision]
min_prob = 0.0           # optional floor; probabilities are calibrated (holdout reliability within ~0.01), so none is needed

[synth]
enabled = true          # add the generator-inversion block for unlabelled countries when training
max_entities = 150000     # Source-1 seeds per unlabelled country (rates & decoy density are measured, not configured)

[explorer]
host = "127.0.0.1"
port = 8765
